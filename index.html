<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIU YUXIN · Portfolio</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --h: 52px;
    --bg: #06080D;
    --border: rgba(255,255,255,0.08);
    --gold: #C8A96E;
    --blue: #0057FF;
    --txt: #F0EBE0;
    --txt2: rgba(240,235,224,0.45);
    --ease: cubic-bezier(.16,1,.3,1);
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); }

  /* ── TOP SHELL NAV ── */
  .shell-nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--h); z-index: 9999;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px;
    background: rgba(6,8,13,0.92);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-bottom: 1px solid var(--border);
  }

  /* Logo */
  .shell-logo {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--txt);
    white-space: nowrap;
  }
  .shell-logo em { font-style: normal; color: var(--gold); }

  /* Tab group */
  .shell-tabs {
    position: relative;          /* ← pill 定位锚点 */
    display: flex; align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px;
    gap: 2px;
  }

  .tab-btn {
    position: relative;
    padding: 6px 22px;
    border: none; background: none;
    font-family: 'DM Sans', 'PingFang SC', sans-serif;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--txt2);
    border-radius: 100px;
    cursor: pointer;
    transition: color 0.3s ease;
    white-space: nowrap;
    z-index: 1;
    outline: none;
  }
  .tab-btn:hover { color: var(--txt); }
  .tab-btn.active { color: var(--bg); }

  /* sliding pill */
  .tab-pill {
    position: absolute;
    top: 4px; left: 4px;
    height: calc(100% - 8px);
    border-radius: 100px;
    background: var(--gold);
    transition: transform 0.38s var(--ease), width 0.38s var(--ease), background 0.3s ease;
    z-index: 0;
    pointer-events: none;
    will-change: transform, width;
  }

  /* Right info */
  .shell-meta {
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--txt2); white-space: nowrap;
    display: flex; align-items: center; gap: 16px;
  }
  .shell-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.7); }
  }

  /* ── IFRAME AREA ── */
  .frames-wrap {
    position: fixed;
    top: var(--h); left: 0; right: 0;
    height: calc(100vh - var(--h));
    overflow: hidden;
  }

  .page-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.45s var(--ease), transform 0.45s var(--ease);
    pointer-events: none;
    background: var(--bg);
  }
  .page-frame.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
    z-index: 1;
  }

  /* ── PAGE INDICATOR ── */
  .page-label {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    z-index: 9998;
    font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--txt2);
    display: flex; align-items: center; gap: 10px;
    opacity: 0;
    animation: fadein 0.6s ease 1.2s forwards;
    pointer-events: none;
  }
  .page-label-line { width: 24px; height: 1px; background: currentColor; opacity: 0.4; }
  @keyframes fadein { to { opacity: 1; } }

  /* ── LOADING OVERLAY ── */
  .frame-loader {
    position: absolute; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .frame-loader.hide { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 36px; height: 36px;
    border: 1.5px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .shell-nav { padding: 0 20px; }
    .shell-meta { display: none; }
    .tab-btn { padding: 6px 14px; font-size: 10px; }
  }
</style>
<!-- 预加载字体保持与子页面一致 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.loli.net/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
</head>
<body>

<!-- TOP NAV -->
<nav class="shell-nav">
  <div class="shell-logo">LIU <em>YU</em>XIN</div>

  <div class="shell-tabs" id="tabGroup">
    <div class="tab-pill" id="tabPill"></div>
    <button class="tab-btn active" data-page="profile" id="btn-profile">个人介绍</button>
    <button class="tab-btn"        data-page="lining"  id="btn-lining">李宁 · 设计简报</button>
  </div>

  <div class="shell-meta">
    <div class="shell-dot" id="statusDot"></div>
    <span id="statusText">Fashion Designer</span>
  </div>
</nav>

<!-- FRAMES -->
<div class="frames-wrap">
  <!-- 加载遮罩 -->
  <div class="frame-loader" id="loader-profile">
    <div class="loader-ring"></div>
  </div>
  <div class="frame-loader" id="loader-lining" style="display:none">
    <div class="loader-ring" style="border-top-color:var(--blue)"></div>
  </div>

  <iframe
    id="frame-profile"
    class="page-frame active"
    src="profile.html"
    title="刘雨欣 · 个人介绍"
  ></iframe>

  <iframe
    id="frame-lining"
    class="page-frame"
    data-src="lining.html"
    title="李宁 27Q3 · 设计简报"
  ></iframe>
</div>

<!-- BOTTOM PAGE LABEL -->
<div class="page-label" id="pageLabel">
  <div class="page-label-line"></div>
  <span id="pageLabelText">个人介绍</span>
  <div class="page-label-line"></div>
</div>

<script>
  const state   = { current: 'profile' };
  const loaded  = { profile: true, lining: false };   // lining 懒加载

  const tabs      = document.querySelectorAll('.tab-btn');
  const pill      = document.getElementById('tabPill');
  const tabGroup  = document.getElementById('tabGroup');
  const frames    = { profile: document.getElementById('frame-profile'), lining: document.getElementById('frame-lining') };
  const loaders   = { profile: document.getElementById('loader-profile'), lining: document.getElementById('loader-lining') };
  const dot       = document.getElementById('statusDot');
  const statusTxt = document.getElementById('statusText');
  const labelTxt  = document.getElementById('pageLabelText');

  const meta = {
    profile: { label: '个人介绍',        status: 'Fashion Designer', dotColor: '#C8A96E', pillColor: '#C8A96E' },
    lining:  { label: '李宁 · 设计简报', status: '27Q3 Tennis',      dotColor: '#0057FF', pillColor: '#0057FF' },
  };

  /* 定位胶囊滑块 —— 相对于 tabGroup 的 padding-left(4px) 内部坐标 */
  function movePill(targetBtn) {
    const gRect = tabGroup.getBoundingClientRect();
    const bRect = targetBtn.getBoundingClientRect();
    pill.style.width     = bRect.width + 'px';
    pill.style.transform = `translateX(${bRect.left - gRect.left - 4}px)`;
  }

  function switchPage(page) {
    if (page === state.current) return;
    state.current = page;

    // 更新 tab 样式
    tabs.forEach(t => t.classList.toggle('active', t.dataset.page === page));
    movePill(document.getElementById('btn-' + page));
    pill.style.background = meta[page].pillColor;

    // 懒加载 lining iframe
    if (!loaded[page]) {
      loaded[page] = true;
      const f = frames[page];
      const ld = loaders[page];
      ld.style.display = 'flex';
      ld.classList.remove('hide');
      f.src = f.dataset.src;
      f.addEventListener('load', () => ld.classList.add('hide'), { once: true });
    }

    // 显隐 frame
    Object.keys(frames).forEach(k => {
      frames[k].classList.toggle('active', k === page);
    });

    // 更新右侧状态
    const m = meta[page];
    dot.style.background = m.dotColor;
    dot.style.boxShadow  = `0 0 8px ${m.dotColor}`;
    statusTxt.textContent = m.status;
    labelTxt.textContent  = m.label;
  }

  // 初始化：等 layout 稳定后定位 pill
  window.addEventListener('load', () => {
    movePill(document.getElementById('btn-profile'));
    loaders.profile.classList.add('hide');
  });
  // 兜底：300ms 后强制定位一次（防字体未加载导致宽度偏差）
  setTimeout(() => movePill(document.getElementById('btn-' + state.current)), 300);

  tabs.forEach(btn => btn.addEventListener('click', () => switchPage(btn.dataset.page)));

  frames.profile.addEventListener('load', () => loaders.profile.classList.add('hide'), { once: true });

  window.addEventListener('resize', () => movePill(document.getElementById('btn-' + state.current)));
</script>
</body>
</html>
